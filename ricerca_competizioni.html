  dati.forEach(d => {
    if (!d.gara.toLowerCase().includes("staffetta") && !isNaN(d.tempo)) {
      let sesso = sessoAtleti[d.nomeAtleta.toLowerCase()] || "M";
      let garaBase = normalizzaGaraBase(d.gara);
      let key = `${d.vasca}_${sesso}_${garaBase}`;
      
      if (!recordSquadraMappa[key] || d.tempo < recordSquadraMappa[key]) {
        recordSquadraMappa[key] = d.tempo;
      }
    }
  });

  let recordStaffettaMappa = {};
  dati.forEach(d => {
    if (d.gara.toLowerCase().includes("staffetta") && !isNaN(d.tempo) && d.tempo > 0) {
      let key = `${d.vasca}_${d.gara.toLowerCase()}`;
      if (!recordStaffettaMappa[key] || d.tempo < recordStaffettaMappa[key]) {
        recordStaffettaMappa[key] = d.tempo;
      }
    }
  });

  function getTagRecordSquadra(tempo, vasca, nomeAtleta, gara, dataGara) {
    if (isNaN(tempo)) return "";
    let sesso = sessoAtleti[nomeAtleta.toLowerCase()] || "M";
    let garaBase = normalizzaGaraBase(gara);
    let key = `${vasca}_${sesso}_${garaBase}`;
    let recordAttuale = recordSquadraMappa[key];

    if (recordAttuale && Math.abs(tempo - recordAttuale) < 0.001) {
      return `<span class="tag-record-viola">RECORD DI SQUADRA</span>`;
    }

    let garePrecedentiEStesse = dati.filter(d => 
      !d.gara.toLowerCase().includes("staffetta") &&
      (sessoAtleti[d.nomeAtleta.toLowerCase()] || "M") === sesso &&
      normalizzaGaraBase(d.gara) === garaBase &&
      d.vasca === vasca &&
      d.data <= dataGara
    );

    if (garePrecedentiEStesse.length > 0) {
      let pbStorico = Math.min(...garePrecedentiEStesse.map(g => g.tempo));
      if (Math.abs(tempo - pbStorico) < 0.001) {
        return `<span class="tag-record-rosso">RECORD DI SQUADRA (BATTUTO)</span>`;
      }
    }

    return "";
  }

  function getTagRecordStaffetta(tempo, vasca, tipoStaffetta, dataGara) {
    if (isNaN(tempo)) return "";
    if (tempo === 0) {
      return `<span class="tag-record-rosso">SQUALIFICATA</span>`;
    }

    let key = `${vasca}_${tipoStaffetta.toLowerCase()}`;
    let recordAttuale = recordStaffettaMappa[key];

    if (recordAttuale && Math.abs(tempo - recordAttuale) < 0.001) {
      return `<span class="tag-record-viola">RECORD DI SQUADRA</span>`;
    }

    let staffettePrecedentiEStesse = dati.filter(d => 
      d.gara.toLowerCase() === tipoStaffetta.toLowerCase() &&
      d.vasca === vasca &&
      d.data <= dataGara &&
      d.tempo > 0
    );

    if (staffettePrecedentiEStesse.length > 0) {
      let pbStorico = Math.min(...staffettePrecedentiEStesse.map(g => g.tempo));
      if (Math.abs(tempo - pbStorico) < 0.001) {
        return `<span class="tag-record-rosso">RECORD DI SQUADRA (BATTUTO)</span>`;
      }
    }

    return "";
  }

  const selectManifestazione = document.getElementById("manifestazioneSelect");

  let mappaEventi = {};
  dati.forEach(d => {
    let base = d.nomeManifestazioneBase;
    if (!mappaEventi[base]) {
      mappaEventi[base] = {
        nome: base,
        dateList: [],
        vasca: d.vasca
      };
    }
    if (d.data !== "9999-12-31" && !mappaEventi[base].dateList.includes(d.data)) {
      mappaEventi[base].dateList.push(d.data);
    }
  });

  let eventiOrdinati = Object.values(mappaEventi).map(ev => {
    ev.dateList.sort();
    let dataStr = "";
    if (ev.dateList.length === 1) {
      dataStr = formattaDataItaliana(ev.dateList[0]);
    } else if (ev.dateList.length > 1) {
      let dInizio = ev.dateList[0].split("-")[2];
      let dFine = formattaDataItaliana(ev.dateList[ev.dateList.length - 1]);
      dataStr = `${dInizio}-${dFine}`;
    }
    return {
      nome: ev.nome,
      dataOrdinamento: ev.dateList[0] || "0000-00-00",
      dataEtichetta: dataStr,
      vasca: ev.vasca
    };
  }).sort((a,b) => b.dataOrdinamento.localeCompare(a.dataOrdinamento));

  eventiOrdinati.forEach(ev => {
    let opt = document.createElement("option");
    opt.value = ev.nome;
    opt.textContent = `${ev.nome} ${ev.dataEtichetta ? '(' + ev.dataEtichetta + ' - ' + ev.vasca + 'm)' : '(' + ev.vasca + 'm)'}`;
    selectManifestazione.appendChild(opt);
  });

  selectManifestazione.addEventListener("change", mostraDettagliManifestazione);

  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const garaRichiesta = params.get("gara");

    if (garaRichiesta) {
      const valorePulito = decodeURIComponent(garaRichiesta).trim().toLowerCase();
      
      for (let i = 0; i < selectManifestazione.options.length; i++) {
        if (selectManifestazione.options[i].value.trim().toLowerCase() === valorePulito) {
          selectManifestazione.selectedIndex = i;
          mostraDettagliManifestazione();
          break;
        }
      }
    }
  });

  function mostraDettagliManifestazione() {
    const manifestazioneScelta = selectManifestazione.value;
    const divRisultati = document.getElementById("risultati");

    if (!manifestazioneScelta) {
      divRisultati.innerHTML = "Seleziona un evento dal menu per visualizzare i dettagli.";
      return;
    }

    let righeManifestazione = dati.filter(d => d.nomeManifestazioneBase === manifestazioneScelta);

    if (righeManifestazione.length === 0) {
      divRisultati.innerHTML = "<p style='text-align:center;'>Nessun dato trovato per questa manifestazione.</p>";
      return;
    }

    let vascaEvento = righeManifestazione[0].vasca;
    let dataInizioManifestazione = righeManifestazione.map(d => d.data).sort()[0];

    let html = "";
    let blocchiStaffette = [];
    let indiciUsatiNelleStaffette = new Set();
    let indiciPassaggiUsati = new Set();

    for (let i = 0; i < righeManifestazione.length; i++) {
      let riga = righeManifestazione[i];

      if (riga.gara.toLowerCase().includes("staffetta") && !indiciUsatiNelleStaffette.has(riga.id)) {
        let tempoStaffetta = riga.tempo;
        let tipoStaffetta = riga.gara;
        let puntiStaffetta = riga.punti;

        let numComponenti = tipoStaffetta.toLowerCase().includes("8x50") ? 8 : 4;

        let componenti = [riga];
        indiciUsatiNelleStaffette.add(riga.id);
        let j = i + 1;
        while (j < righeManifestazione.length && componenti.length < numComponenti) {
          if (righeManifestazione[j].gara === tipoStaffetta && Math.abs(righeManifestazione[j].tempo - tempoStaffetta) < 0.01) {
            componenti.push(righeManifestazione[j]);
            indiciUsatiNelleStaffette.add(righeManifestazione[j].id);
          }
          j++;
        }

        let passaggi = [];
        let pos = j;
        let nomiFrazionisti = componenti.map(c => c.nomeAtleta.toLowerCase());
        
        while (pos < righeManifestazione.length) {
          let rigaP = righeManifestazione[pos];
          if (rigaP.gara.toLowerCase().includes("staffetta")) {
            break;
          }
          if (nomiFrazionisti.includes(rigaP.nomeAtleta.toLowerCase())) {
            passaggi.push(rigaP);
            indiciPassaggiUsati.add(rigaP.id);
          } else {
            break;
          }
          pos++;
        }

        blocchiStaffette.push({
          tipo: tipoStaffetta,
          tempo: tempoStaffetta,
          punti: puntiStaffetta,
          componenti: componenti,
          passaggi: passaggi,
          data: riga.data
        });

        i = pos - 1;
      }
    }

    blocchiStaffette.forEach(st => {
      if (st.passaggi.length === 0) {
        let staffetta8x50Stile = blocchiStaffette.find(b => b.tipo.toLowerCase().includes("8x50") && b.passaggi.length > 0);
        if (staffetta8x50Stile) {
          let passaggiRecuperati = [];
          st.componenti.forEach(comp => {
            let pTrovato = staffetta8x50Stile.passaggi.find(p => p.nomeAtleta.toLowerCase() === comp.nomeAtleta.toLowerCase() && p.gara.toLowerCase().includes("stile libero"));
            if (pTrovato) passaggiRecuperati.push(pTrovato);
          });
          if (passaggiRecuperati.length === st.componenti.length) {
            st.passaggi = passaggiRecuperati;
          }
        }
      }
    });

    let individuali = righeManifestazione.filter(d => 
      !d.gara.toLowerCase().includes("staffetta") && 
      !d.gara.toLowerCase().includes("lanciato") &&
      !indiciUsatiNelleStaffette.has(d.id) &&
      !indiciPassaggiUsati.has(d.id)
    );

    if (individuali.length > 0) {
      html += `<div class="sezione-titolo">Gare individuali: ${manifestazioneScelta} (Vasca ${vascaEvento}m)</div>`;
      html += `<table>
        <thead>
          <tr>
            <th>Atleta</th>
            <th>Gara</th>
            <th>Tempo</th>
            <th>Miglioramento PB (${vascaEvento}m)</th>
            <th>Punti FINA</th>
          </tr>
        </thead>
        <tbody>`;

      individuali.forEach(r => {
        let garePrecedentiStessaVasca = dati.filter(d => 
          d.nomeAtleta.toLowerCase() === r.nomeAtleta.toLowerCase() && 
          d.gara.toLowerCase() === r.gara.toLowerCase() && 
          d.vasca === r.vasca &&
          d.nomeManifestazioneBase !== manifestazioneScelta &&
          d.data < dataInizioManifestazione
        );

        let diffHtml = "-";
        if (garePrecedentiStessaVasca.length > 0) {
          let pbPrecedente = Math.min(...garePrecedentiStessaVasca.map(g => g.tempo));
          let diff = r.tempo - pbPrecedente;
          if (diff < -0.001) {
            diffHtml = `<span style="color: green; font-weight: bold;">${diff.toFixed(2)}s</span>`;
          } else if (diff > 0.001) {
            diffHtml = `<span style="color: red; font-weight: bold;">+${diff.toFixed(2)}s</span>`;
          } else {
            diffHtml = `<span style="color: gray;">=</span>`;
          }
        }

        let tagRecord = getTagRecordSquadra(r.tempo, r.vasca, r.nomeAtleta, r.gara, r.data);

        html += `<tr>
          <td><strong>${r.nomeAtleta}</strong></td>
          <td>${formattaGaraTitleCase(r.gara)}${tagRecord}</td>
          <td><strong>${formattaTempo(r.tempo)}</strong></td>
          <td>${diffHtml}</td>
          <td><strong>${r.punti}</strong></td>
        </tr>`;
      });

      html += `</tbody></table>`;
    }

    if (blocchiStaffette.length > 0) {
      html += `<div class="sezione-titolo">Staffette: ${manifestazioneScelta} (Vasca ${vascaEvento}m)</div>`;
      
      html += `<table>
        <thead>
          <tr>
            <th>Tipo Staffetta</th>
            <th>Tempo Totale</th>
            <th>Punti FINA Staffetta</th>
          </tr>
        </thead>
        <tbody>`;

      blocchiStaffette.forEach(st => {
        let tagRecordStaffetta = getTagRecordStaffetta(st.tempo, vascaEvento, st.tipo, st.data);
        let tempoMostrato = st.tempo === 0 ? "SQ" : formattaTempo(st.tempo);

        html += `<tr>
          <td><strong>${formattaGaraTitleCase(st.tipo)}</strong>${tagRecordStaffetta}</td>
          <td><strong>${tempoMostrato}</strong></td>
          <td><strong>${st.punti}</strong></td>
        </tr>
        <tr>
          <td colspan="3" class="riga-passaggi-container">
            <strong>Frazionisti e Passaggi Individuali:</strong><br><br>`;

        st.componenti.forEach((comp, idx) => {
          let nomeFrazionista = comp.nomeAtleta;
          let pass = st.passaggi.find(p => p.nomeAtleta.toLowerCase() === nomeFrazionista.toLowerCase());

          let strPassaggio = "";
          if (pass) {
            let nomeGaraPass = formattaGaraTitleCase(pass.gara);
            let tempoPass = formattaTempo(pass.tempo);

            let garePrecedentiPassaggio = dati.filter(d => 
              d.nomeAtleta.toLowerCase() === pass.nomeAtleta.toLowerCase() && 
              d.gara.toLowerCase() === pass.gara.toLowerCase() &&
              d.vasca === vascaEvento &&
              d.nomeManifestazioneBase !== manifestazioneScelta &&
              d.data < dataInizioManifestazione
            );

            let diffPassaggioHtml = "";
            if (garePrecedentiPassaggio.length > 0) {
              let pbPrecPass = Math.min(...garePrecedentiPassaggio.map(g => g.tempo));
              let diff = pass.tempo - pbPrecPass;
              if (diff < -0.001) {
                diffPassaggioHtml = `<span style="color: green; font-weight: bold;"> (${diff.toFixed(2)}s)</span>`;
              } else if (diff > 0.001) {
                diffPassaggioHtml = `<span style="color: red; font-weight: bold;"> (+${diff.toFixed(2)}s)</span>`;
              } else {
                diffPassaggioHtml = `<span style="color: gray;"> (=)</span>`;
              }
            }

            let tagRecordPass = getTagRecordSquadra(pass.tempo, vascaEvento, pass.nomeAtleta, pass.gara, st.data);
            strPassaggio = ` — Passaggio (${nomeGaraPass}): <strong>${tempoPass}</strong>${diffPassaggioHtml} | Punti FINA: <strong>${pass.punti}</strong> ${tagRecordPass}`;
          }

          html += `<div class="frazionista-riga">
            <b>${idx + 1}° Frazione:</b> <strong>${nomeFrazionista}</strong>${strPassaggio}
          </div>`;
        });

        html += `</td></tr>`;
      });

      html += `</tbody></table>`;
    }

    divRisultati.innerHTML = html;
  }
  </script>
</body>
</html>
